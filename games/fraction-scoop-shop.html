<script>
"use strict";
/* ============ helpers ============ */
const INK='#1d2a44', SHADE='#ff8a1f', ACCENT='#4b6bff', GOOD='#0fae84';
function el(tag, attrs, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v===false||v==null) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
const NS='http://www.w3.org/2000/svg';
function sv(tag, attrs, ...kids){
  const e=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(attrs||{})){ if(v==null) continue; if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
  for(const c of kids.flat()){ if(c==null) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
const H=s=>el('div',{html:s});
const fr=(n,d,cls='')=>`<span class="frac ${cls}"><span>${n}</span><span>${d}</span></span>`;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const range=n=>[...Array(n).keys()];
const NAMES={1:['whole','wholes'],2:['half','halves'],3:['third','thirds'],4:['fourth','fourths'],5:['fifth','fifths'],6:['sixth','sixths'],7:['seventh','sevenths'],8:['eighth','eighths'],9:['ninth','ninths'],10:['tenth','tenths'],12:['twelfth','twelfths']};
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
function fracWords(n,d){ const w2 = d===2 ? (n===1?'half':'halves') : NAMES[d][n===1?0:1]; return NUMW[n]+'-'+w2; }
const pfine = ()=>{ try{return matchMedia('(pointer:fine)').matches;}catch(e){return true;} };

/* ============ progress (light, per browser) ============ */
const STORE='chris-fractions-v1';
const MEM={}; function loadP(){ return MEM; }
function saveP(p){ /* Study Scoop saves nothing (D4) */ }
function record(kind,id,score,of){ const p=loadP(); p[kind]=p[kind]||{}; const old=p[kind][id]; if(!old || score/of >= old.score/old.of) p[kind][id]={score,of}; saveP(p); }

/* ============ shapes ============ */
function sectorPath(cx,cy,R,a0,a1){

/* ============ mistake diagnosis ============ */
function diagFrac(q,n,d){
  const [A,B]=q.answer, c=q.ctx||{};

  if(d===0) return {msg:'The bottom number can’t be 0. Count the parts again.'};
  if(c.kind==='one'&&n===1&&d===1) return {msg:'Yes — it IS 1 whole! Now write it as a fraction: count the parts for the bottom, and the shaded parts for the top.'};
  if(n===B&&d===A&&A!==B) return {msg:'You flipped it! The TOP number counts the parts we’re talking about. The BOTTOM number counts ALL the equal parts in one whole.'};
  if(n*B===A*d) return {msg:c.kind==='word'?'That’s the same amount, but write the fraction the words say: first word → top, second word → bottom.':'That’s the same amount, but write the fraction the picture shows. Count every equal part you see.'};
  switch(c.kind){
    case 'shape':
      if(c.not&&n===B-A&&d===B) return {msg:'That’s the SHADED part. This one asks for the parts that are NOT shaded (the white ones).'};
      if(!c.not&&n===B-A&&d===B) return {msg:'You counted the white parts. The top number counts the SHADED (colored) parts.'};
      if(n===A&&d===B-A) return {msg:'You put shaded over not-shaded. The bottom counts ALL the parts — shaded AND white.'};
      if(d!==B) return {msg:'Check the bottom number. Count ALL the equal parts in the whole — the shaded ones and the white ones.'};
      return {msg:'Your bottom number is right! Now count only the '+(c.not?'white (not shaded)':'shaded')+' parts for the top.'};
    case 'unit':
      if(n!==1) return {msg:'A unit fraction is ONE part, so the top number is always 1.'};
      return {msg:'Top is right! Now count how many equal parts are in the whole for the bottom.'};
    case 'line':
      if(d===B+1) return {msg:'You counted the tick marks. Count the SPACES (jumps) between 0 and 1 instead — there is always one less space than marks.'};
      if(c.span&&d===c.span&&d!==B) return {msg:'The bottom number only counts the spaces between 0 and 1 — not the whole line.'};
      if(d!==B) return {msg:'Check the bottom number: count the equal spaces between 0 and 1.'};
      if(Math.abs(n-A)===1) return {msg:'Your bottom number is right! Count the jumps from 0 again. Start ON 0 — the 0 mark is not a jump.'};
      return {msg:'Your bottom number is right! Start at 0 and count every jump to the point.'};
    case 'set':
      if(n===c.other&&d===B) return {msg:`You counted the ${c.otherName}. The question asks about the ${c.name}.`};
      if(n===A&&d===c.other) return {msg:`The bottom number is the WHOLE group. Count every item, not just the ${c.otherName}.`};
      if(d!==B) return {msg:'The whole is the WHOLE group. Count every item for the bottom number.'};
      return {msg:`Your bottom number is right! Now count only the ${c.name} for the top.`};
    case 'word':
      if(d!==B) return {msg:`Look at the second word, “${c.w2}.” It tells how many equal parts make the whole — that’s the bottom number.`};
      return {msg:`Your bottom number is right! Look at the first word, “${c.w1}.” It tells the top number.`};
    case 'wholes': { const one=c.item||'bar', many=c.items||'bars';
      if(d===A) return {msg:`The bottom number is the parts in ONE whole (one ${one}) — not all the ${many} together.`};
      if(n===c.k) return {msg:'That’s how many wholes. The top number counts all the shaded PARTS.'};
      if(d!==B) return {msg:`Look at just ONE ${one}. How many equal parts is it cut into? That’s the bottom number.`};
      return {msg:c.item?`Your bottom number is right! Now count all the ${many}.`:'Your bottom number is right! Now count every shaded part in all the bars.'}; }
    case 'one':
      if(d!==B) return {msg:'Count ALL the equal parts for the bottom number.'};
      return {msg:'Count the shaded parts for the top number. Are they ALL shaded?'};
  }
  if(d!==B) return {msg:'Check the bottom number.'};
  return {msg:'Check the top number.'};

    lock=()=>{};
  } else if(q.type==='place'){
    let picked=null; vis=numberLine(Object.assign({},q.line,{click:true,onPick:i=>{picked=i; fb.className='fb';}})); visBox.append(vis); ans.append(checkBtn);
    evaluate=()=>{ if(picked==null) return null; if(picked===q.answer) return {ok:true};
      const den=q.line.den; if(picked===0) return {msg:'That’s 0. Start at 0 and hop forward.'};
      if(Math.abs(picked-q.answer)===1) return {msg:'So close! Count the jumps again. Start ON 0 — the 0 mark is not a jump.'};
      if((q.line.max||1)===1&&picked===den-q.answer) return {msg:'It looks like you counted back from 1. Always start counting jumps at 0.'};
      return {msg:`You landed on ${fr(picked,den)}. The top number tells how many jumps from 0.`}; };
    lock=()=>{vis._locked=true;};
  }
  box.append(ans,fb);
  // hints
  const hintsBox=el('div'); const hb=el('div',{class:'hintbar'});
  const hbtns=(q.hints||[]).map((h,i)=>{ const last=i===q.hints.length-1&&q.hints.length>1; const b=el('button',{disabled:i>0?'':false,onclick:()=>showHint(i)}, last?'💡 Show me':`💡 Hint ${i+1}`); hb.append(b); return b; });
  function showHint(i){ if(i<hintsShown) return; for(let j=hintsShown;j<=i;j++){ const last=j===q.hints.length-1&&q.hints.length>1;
      hintsBox.append(el('div',{class:'hint',html:`<b class="lbl">${last?'Show me:':'Hint '+(j+1)+':'}</b> `+q.hints[j]}));
      if(last&&q.showMe&&vis) q.showMe(vis);
      hbtns[j].disabled=true; if(hbtns[j+1]) hbtns[j+1].disabled=false; }
    hintsShown=i+1; }
  if(hbtns.length) box.append(hb,hintsBox);
  function check(){
    if(solved) return; const r=evaluate();
    if(r==null){ setFb('info','Answer first, then press Check.'); return; }
    attempts++;
    if(r.ok){ solved=true; lock(); checkBtn.disabled=true; hbtns.forEach(b=>b.disabled=true);
      setFb('ok',pick(PRAISE)+(q.after?`<div style="font-weight:700;margin-top:4px">${q.after}</div>`:''));
      opts.onResult&&opts.onResult({firstTry:attempts===1&&hintsShown===0});
    } else {
      setFb('bad',r.msg);
      if(attempts>=2&&hintsShown<Math.min(2,hbtns.length)) showHint(Math.min(attempts-1,Math.min(2,hbtns.length)-1));
    }
  }
  box._solved=()=>solved;
  return box;
}

function wholeBuilder({start=1,cuts=[1,2,3,4,6,8],shape='bar',showShape=true}={}){
  let n=start,kind=shape,shaded=new Set();
  const wrap=el('div',{class:'widget'});
  const tb1=el('div',{class:'toolbar'}),tb2=el('div',{class:'toolbar'}),pic=el('div',{class:'vis'}),out=el('div',{class:'readout'});
  function draw(){
    tb1.replaceChildren(el('b',{},'Shape:'),...['bar','circle'].map(k=>el('button',{class:k===kind?'sel':'',onclick:()=>{kind=k;draw();}},k==='bar'?'Bar ▭':'Circle ◯')));
    tb2.replaceChildren(el('b',{},'Cut into:'),...cuts.map(c=>el('button',{class:c===n?'sel':'',onclick:()=>{n=c;shaded=new Set();draw();}},String(c))));
    pic.replaceChildren(shapeSVG({kind,n,w:440,h:90,r:82},{shaded,click:true,onChange:readout}));
    readout();
  }
  function readout(){ const a=shaded.size; let s='';
    if(n===1) s=a?'The whole thing is colored: <b>1 whole</b>.':'This is <b>1 whole</b>. Tap a number to cut it into equal parts.';
    else { s=`<div class="row">${fr(a,n,'lg')}<div class="small">top <b>${a}</b> = parts colored (<span class="good-t">numerator</span>)<br>bottom <b>${n}</b> = equal parts in the whole (<span style="color:var(--accent)">denominator</span>)</div></div>`;
      s+=`<div class="small" style="margin-top:6px">${n} equal parts are called <b>${NAMES[n][1]}</b>. Each part is ${fr(1,n)}.</div>`;
      if(a===n) s+=`<div class="win">All ${n} parts are colored: ${fr(n,n)} = 1 whole! 🎉</div>`;
      else if(a===1) s+=`<div class="small" style="margin-top:4px">${fr(1,n)} is a <b>unit fraction</b> — just ONE part.</div>`;
      else if(a===0) s+='<div class="small muted">Tap the parts to color them.</div>'; }
    out.innerHTML=s; }
  if(showShape) wrap.append(tb1); wrap.append(tb2,pic,out); draw(); return wrap;
}
function lineBuilder({max=1,dens=[2,3,4,6,8],start=4}={}){
  let den=start,pk=null; const wrap=el('div',{class:'widget'});
  const tb=el('div',{class:'toolbar'}),pic=el('div',{class:'vis'}),out=el('div',{class:'readout'});
  function draw(){ tb.replaceChildren(el('b',{},'Cut each whole into:'),...dens.map(d=>el('button',{class:d===den?'sel':'',onclick:()=>{den=d;pk=null;draw();}},String(d))));
    const s=numberLine({den,max,strip:true,click:true,stripShade:pk||0,onPick:i=>{pk=i;draw();}}); if(pk!=null){s._mark(pk);s._jumps(pk);} pic.replaceChildren(s); readout(); }
  function readout(){ if(pk==null){out.innerHTML='<span class="muted">Tap any tick mark on the line.</span>';return;}
    if(pk===0){out.innerHTML='That’s 0 — no jumps yet.';return;}
    let s=`${pk} jump${pk>1?'s':''} of ${fr(1,den)} from 0 → ${fr(pk,den,'lg')}`;
    if(pk===den) s+=' = <b>1 whole</b>! 🎉'; else if(pk%den===0) s+=` = <b>${pk/den} wholes</b>!`; else if(pk>den) s+=' — <b>more than 1 whole!</b>';

}

    const c=el('div',{class:'card'},
      el('div',{class:'row',style:'justify-content:space-between;gap:8px'},
        el('div',{class:'row',style:'gap:8px'},el('span',{class:'fun',style:'font-size:24px;font-weight:700;color:#0b5fd6'},`Problem ${i+1}`),el('span',{class:'pill',style:`border-color:${fc}`},HFLAV[it.hid][1]+' Like homework: '+Hp.title)),
        el('div',{class:'adult',style:'margin:0'},...Hp.help.slice(0,1).map(id=>el('button',{onclick:()=>go(id)},`Help: Lesson ${LBY[id].num}`)))),
      how,
      renderQ(it.q,{labels:Hp.labels,onResult:r=>{state[i].solved=true; state[i].first=r.firstTry; nextBtn.style.display='inline-block'; upd();}}),
      nextBtn);
    state[i].el=c; return c;
  }
  function go2(i){ if(i>=items.length){ finish(); return; } idx=Math.max(0,i); draw(); window.scrollTo(0,0); }
  function upd(){
    const done=state.filter(x=>x.solved).length, first=state.filter(x=>x.first).length;
    score.innerHTML=`Solved: ${done} / ${items.length} <span class="small muted">(${first} on the first try, no hints)</span>`;
    dots.replaceChildren(...items.map((_,j)=>el('button',{class:(state[j].solved?(state[j].first?'done':'done1'):'')+(j===idx?' cur':''),title:HWBY[items[j].hid].title,onclick:()=>go2(j)},String(j+1))));
    if(done===items.length) record('practice','all',first,items.length);
  }
  function draw(){ body.replaceChildren(card(idx)); upd();
    nav.replaceChildren(idx>0?el('button',{class:'btn alt',onclick:()=>go2(idx-1)},'← Back'):el('span'),
      el('span',{class:'small muted',style:'align-self:center;font-weight:800'},`${idx+1} of ${items.length}`),
      el('button',{class:'btn',onclick:()=>go2(idx+1)},idx<items.length-1?'Next →':'Finish ✓'));
    const f=body.querySelector('input'); if(f&&pfine()) f.focus(); }
  function finish(){
    const done=state.filter(x=>x.solved).length, first=state.filter(x=>x.first).length;
    const missed=items.map((it,j)=>(!state[j].first)?j:-1).filter(j=>j>=0);
    const byType={}; missed.forEach(j=>{const t=HWBY[items[j].hid].title; byType[t]=(byType[t]||0)+1;});
    body.replaceChildren(el('div',{class:'card summary'},el('div',{class:'stars'},first/items.length>=0.8?'🍦🍦🍦':first/items.length>=0.6?'🍦🍦':'🍦'),
      el('div',{class:'score'},`${done} of ${items.length} solved · ${first} on the first try`),
      Object.keys(byType).length?el('div',{class:'key',style:'text-align:left',html:'<b>Practice more of these:</b><br>'+Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`${t}: ${n} needed help or were skipped`).join('<br>')}):P('Every one right on the first try! 🍒'),
      el('div',{class:'row',style:'justify-content:center'},missed.length?el('button',{class:'btn alt',onclick:()=>go2(missed[0])},'Go to the first one he missed'):null,el('button',{class:'btn',onclick:build},'🔄 New set of 50'))));
    nav.replaceChildren(el('button',{class:'btn alt',onclick:()=>go2(items.length-1)},'← Back'),el('span'),el('span'));
    upd(); window.scrollTo(0,0);
  }
  app.replaceChildren(topbar(null),banner('blue','All homework types','Practice Questions','50 problems: number lines, shapes, sets, words and vocabulary','🍨'),
    el('div',{class:'adult'},el('span',{class:'lbl'},'For grown-ups:'),el('button',{onclick:build},'🔄 New set of 50'),el('button',{onclick:finish},'📊 See results')),
    el('div',{class:'hwhead'},el('div',{class:'small muted',style:'font-weight:800'},'Tap any number to jump. Light green = solved with help. Dark green = right on the first try.'),score),
    dots,body,nav);
  build();
}

function route(){
  const h=(location.hash||'#home').slice(1); window.scrollTo(0,0);
  if(LBY[h]) return lessonView(LBY[h]);
  if(HWBY[h]) return hwView(HWBY[h]);
  if(h==='practice') return practiceView();
  home();
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
