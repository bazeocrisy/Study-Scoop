function save(){try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){}}
function last(arr){return arr.length?arr[arr.length-1]:null}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pctOf(s){return s&&s.total?Math.round(s.correct/s.total*100):0}
function html(s,focus){$('#content').innerHTML=s;document.body.classList.toggle('focus',!!focus);window.scrollTo(0,0)}
function button(label,action,cls){return '<button type="button" class="btn '+(cls||'')+'" data-action="'+action+'">'+label+'</button>'}
function stars(p){var n=p>=90?3:p>=70?2:p>=40?1:0,s='';for(var i=0;i<3;i++)s+='<span class="'+(i<n?'on':'')+'">★</span>';return '<div class="stars" aria-label="'+n+' of 3 stars">'+s+'</div>'}
function cheer(p){return p===100?'PERFECT GAME! You got every one! 🏆':p>=90?'Home run! Amazing job! ⚾':p>=70?'Great hitting! You are getting strong!':p>=40?'Nice swings! Keep practicing!':'Every pro starts here. Let’s practice!'}

/* ---------- number pad ---------- */
function keypad(goLabel){var k='';['1','2','3','4','5','6','7','8','9'].forEach(function(n){k+='<button type="button" class="key" data-key="'+n+'">'+n+'</button>'});
k+='<button type="button" class="key erase" data-key="del" aria-label="Erase">⌫</button><button type="button" class="key" data-key="0">0</button><button type="submit" class="key go">'+goLabel+'</button>';
return '<div class="keypad">'+k+'</div>'}
function numBox(id,label){return '<input id="'+id+'" class="numberinput" inputmode="none" type="text" maxlength="2" autocomplete="off" aria-label="'+label+'">'}
function wireInputs(){var ins=document.querySelectorAll('.numberinput');for(var i=0;i<ins.length;i++){(function(el){
  el.addEventListener('focus',function(){setActive(el)});el.addEventListener('click',function(){setActive(el)});
  el.addEventListener('input',function(){el.value=el.value.replace(/\D/g,'').slice(0,2);hideHint()});})(ins[i])}
  if(ins.length)setActive(ins[0])}
function setActive(el){activeInput=el;if(document.activeElement!==el){try{el.focus({preventScroll:true})}catch(e){el.focus()}}var ins=document.querySelectorAll('.numberinput');for(var i=0;i<ins.length;i++)ins[i].classList.toggle('active',ins[i]===el)}
function pressKey(k){var el=activeInput;if(!el||!document.body.contains(el))return;if(k==='del')el.value=el.value.slice(0,-1);else if(el.value.length<2)el.value=el.value==='0'?k:el.value+k;hideHint();
  if(k!=='del'&&el.id==='factorA'&&el.value.length===2&&$('#factorB'))setActive($('#factorB'))}
function showHint(msg){var h=$('#hint');if(h){h.textContent=msg;h.classList.remove('hidden');h.classList.remove('shake');void h.offsetWidth;h.classList.add('shake')}}
function hideHint(){var h=$('#hint');if(h)h.classList.add('hidden')}
function readNum(el){if(!el||el.value.trim()==='')return null;var n=Number(el.value);return Number.isInteger(n)&&n>=0?n:null}

/* ---------- navigation ---------- */
function nav(mode){currentMode=mode;practiceState='';
  if(mode==='home')showHome();else if(mode==='facts'||mode==='answer')setupTest(mode);else if(mode==='area'||mode==='sticks')showVisual(mode);else if(mode==='flash')startFlash('all');else if(mode==='report')showReport()}

function tile(action,cls,icon,title,sub){return '<button class="mode '+cls+'" data-action="'+action+'"><span class="symbol" aria-hidden="true">'+icon+'</span><span><strong>'+title+'</strong><small>'+sub+'</small></span><span class="go" aria-hidden="true">›</span></button>'}
function showHome(){var latest=last(data.sessions);
  html('<h2 class="page-title">Hi, Chris! Ready to play? ⚾</h2><p class="lead">Pick a game. Tap a big button to start.</p>'+
  (data.active?'<button class="bigplay resume" data-action="resume"><span>▶</span> Keep going with your quiz <small>Question '+(data.active.answers.length+1)+' of '+data.active.questions.length+'</small></button>':
   '<button class="bigplay" data-action="facts"><span>▶</span> Play Ball! Start a Quiz</button>')+
  '<div class="menu">'+
  tile('facts','','✖️','Times Quiz','Answer the problems')+
  tile('answer','answer','🔍','Missing Number','Find the hidden number')+
  tile('area','area','🟩','Build Boxes','See it as rows of squares')+
  tile('sticks','sticks','🥢','Count Sticks','Groups of sticks')+
  tile('flash','flash','🃏','Flash Cards','Flip and learn')+
  tile('report','report','⭐','My Scores','See your stars')+'</div>'+
  (latest?'<div class="lastgame"><span>Last game:</span> '+stars(pctOf(latest))+'<b>'+latest.correct+' out of '+latest.total+'</b></div>':''))}

/* ---------- quiz setup ---------- */
function chip(group,value,label,on){return '<button type="button" class="chip'+(on?' on':'')+'" data-chip="'+group+'" data-value="'+value+'">'+label+'</button>'}
function setupTest(mode){currentMode=mode;var title=mode==='facts'?'✖️ Times Quiz':'🔍 Missing Number';
  html('<h2 class="page-title">'+title+'</h2><p class="lead">'+(mode==='facts'?'Solve each problem. Your score shows at the end.':'Find the number that is hiding in the box.')+'</p>'+
  '<h3 class="subhead">How many questions?</h3><div class="chips" id="lenChips">'+
  chip('len',13,'⚡ Quick<small>13</small>',testLength===13)+chip('len',26,'Medium<small>26</small>',testLength===26)+chip('len',39,'Long<small>39</small>',testLength===39)+chip('len',117,'🏆 All of them<small>117</small>',testLength===117)+'</div>'+
  (mode==='answer'?'<h3 class="subhead">What kind?</h3><div class="chips" id="styleChips">'+chip('style','missing','4 × ☐ = 12<small>One box</small>',answerStyle==='missing')+chip('style','both','☐ × ☐ = 12<small>Two boxes (harder)</small>',answerStyle==='both')+'</div>':'')+
  '<div class="actions center" style="margin-top:26px">'+button('Play Ball! ⚾','beginTest','primary huge')+'</div><div class="actions center" style="margin-top:12px">'+button('← Back','home','light')+'</div>')}
function pickChip(el){var g=el.getAttribute('data-chip'),v=el.getAttribute('data-value');if(g==='len')testLength=Number(v);else answerStyle=v;
  var sib=document.querySelectorAll('[data-chip="'+g+'"]');for(var i=0;i<sib.length;i++)sib[i].classList.toggle('on',sib[i]===el)}
function beginTest(){if(data.active&&!confirm('You already have a quiz going. Start a new one instead?'))return;
  data.active={type:currentMode,style:currentMode==='answer'?answerStyle:'vertical',questions:shuffle(FACTS).slice(0,testLength),answers:[],startedAt:new Date().toISOString()};save();renderQuestion()}
function resume(){if(!data.active)return nav('home');currentMode=data.active.type;renderQuestion()}

/* ---------- quiz ---------- */
function renderQuestion(){var s=data.active;if(!s)return nav('home');var i=s.answers.length;if(i>=s.questions.length)return finishTest();
  var f=s.questions[i],percent=Math.round(i/s.questions.length*100),problem='';
  if(s.type==='facts')problem='<div class="mathstack" aria-label="'+f.a+' times '+f.b+'"><span class="first">'+f.a+'</span><span class="operator">×</span><span class="second">'+f.b+'</span><div class="rule"></div></div>'+numBox('response','Answer');
  else if(s.style==='missing')problem='<div class="factorline"><span>'+(f.a===0?f.b:f.a)+' ×</span>'+numBox('response','Missing number')+'<span>= '+f.p+'</span></div>';
  else problem='<div class="factorline">'+numBox('factorA','First number')+'<span>×</span>'+numBox('factorB','Second number')+'<span>= '+f.p+'</span></div><div class="tip">Tap a box to pick it</div>';
  var lastQ=i+1===s.questions.length;
  html('<div class="testhead"><span class="qcount">Question <b>'+(i+1)+'</b> of '+s.questions.length+'</span><div class="basepath" aria-hidden="true"><i style="width:'+percent+'%"></i><em style="left:'+percent+'%">⚾</em></div></div>'+
  '<form id="testForm" autocomplete="off"><div class="questioncard">'+problem+'<div id="hint" class="hint hidden" role="alert"></div>'+keypad(lastQ?'Finish ✓':'Next ✓')+'</div></form>'+
  '<div class="actions center" style="margin-top:14px">'+button('Take a break','home','light')+button('I’m done','earlyFinish','sm plain')+'</div>',true);
  $('#testForm').addEventListener('submit',submitAnswer);wireInputs()}
function validPair(x,y,p){return x!==null&&y!==null&&x*y===p&&((x<=8&&y<=12)||(y<=8&&x<=12))}
function submitAnswer(e){e.preventDefault();var s=data.active;if(!s)return;var f=s.questions[s.answers.length],value,correct;
  if(s.type==='answer'&&s.style==='both'){var x=readNum($('#factorA')),y=readNum($('#factorB'));if(x===null||y===null){showHint('Fill in both boxes first 🙂');setActive(x===null?$('#factorA'):$('#factorB'));return}value=[x,y];correct=validPair(x,y,f.p)}
  else{value=readNum($('#response'));if(value===null){showHint('Type your answer first 🙂');return}correct=s.type==='facts'?value===f.p:((f.a===0?f.b:f.a)===0?value>=0:value===(f.a===0?f.a:f.b))}
  s.answers.push({id:f.id,a:f.a,b:f.b,p:f.p,given:value,correct:correct,at:new Date().toISOString()});save();
  if(s.answers.length===s.questions.length)finishTest();else renderQuestion()}
function earlyFinish(){if(!data.active)return;if(!data.active.answers.length){if(confirm('Stop this quiz?')){data.active=null;save();nav('home')}return}
  if(confirm('All done? We will score the questions you answered.'))finishTest(true)}
function finishTest(partial){var s=data.active;if(!s)return;var c=0;s.answers.forEach(function(x){if(x.correct)c++});
  var record={type:s.type,style:s.style,startedAt:s.startedAt,finishedAt:new Date().toISOString(),total:s.answers.length,planned:s.questions.length,partial:!!partial,correct:c,answers:s.answers};
  data.sessions.push(record);data.active=null;save();renderResults(record)}
function recentMistakes(){var byId={},order=[];data.sessions.forEach(function(session){session.answers.forEach(function(a){if(!a.correct){if(!byId[a.id])order.push(a.id);byId[a.id]=a}else delete byId[a.id]})});
  var out=[];order.forEach(function(id){if(byId[id]&&out.indexOf(byId[id])<0)out.push(byId[id])});return out}
function factCard(x){var g=Array.isArray(x.given)?x.given.join(' × '):x.given;return '<div class="miss"><b>'+x.a+' × '+x.b+' = '+x.p+'</b><small>You said <s>'+g+'</s></small></div>'}
function renderResults(s){var misses=s.answers.filter(function(x){return !x.correct}),p=pctOf(s);
  html('<div class="results"><h2 class="page-title">'+cheer(p)+'</h2>'+stars(p)+'<div class="bigscore"><b>'+s.correct+'</b> out of <b>'+s.total+'</b> right</div></div>'+
  (misses.length?'<div class="actions center">'+button('🃏 Practice the ones I missed','reviewMissed','gold huge')+button('🔁 Try them again','retest','primary')+'</div><h3 class="subhead">Let’s learn these:</h3><div class="misses">'+misses.map(factCard).join('')+'</div>':
   '<div class="actions center">'+button('▶ Play again','facts','primary huge')+'</div>')+
  '<div class="actions center" style="margin-top:22px">'+button('⭐ My Scores','report','light')+button('🏠 Home','home','light')+'</div>');if(p>=90)confetti()}
function confetti(){var box=document.createElement('div');box.className='confetti';var c=['#f5bd3f','#1fa65d','#d23a4a','#1a5fa8','#6d4bc4'];for(var i=0;i<40;i++){var b=document.createElement('i');b.style.left=Math.random()*100+'%';b.style.background=c[i%5];b.style.animationDelay=Math.random()*0.6+'s';b.style.transform='rotate('+Math.random()*360+'deg)';box.appendChild(b)}document.body.appendChild(box);setTimeout(function(){box.remove()},3200)}

/* ---------- flash cards ---------- */
function startFlash(source){currentMode='flash';flashSource=source;var facts=source==='missed'?recentMistakes().map(function(x){return FACTS.filter(function(f){return f.id===x.id})[0]}).filter(Boolean):FACTS;flashList=shuffle(facts);flashIndex=0;flashFlipped=false;renderFlash()}
function renderFlash(){if(!flashList.length){html('<h2 class="page-title">🃏 Flash Cards</h2><div class="note big">No missed facts right now. Great job! 🎉</div><div class="actions center" style="margin-top:16px">'+button('Use all the cards','flashAll','primary huge')+button('🏠 Home','home','light')+'</div>');return}
  var f=flashList[flashIndex];
  html('<div class="testhead"><span class="qcount">Card <b>'+(flashIndex+1)+'</b> of '+flashList.length+'</span><div class="seg">'+'<button type="button" class="'+(flashSource==='all'?'on':'')+'" data-action="flashAll">All cards</button><button type="button" class="'+(flashSource==='missed'?'on':'')+'" data-action="reviewMissed">Missed ones</button></div></div>'+
  '<div class="flashcard'+(flashFlipped?' flipped':'')+'" id="flashCard" role="button" tabindex="0" aria-label="Flip card"><span class="small">'+(flashFlipped?'ANSWER':'WHAT IS IT?')+'</span><div class="face">'+(flashFlipped?f.a+' × '+f.b+' = <em>'+f.p+'</em>':f.a+' × '+f.b)+'</div><p>'+(flashFlipped?'':'Tap the card to flip it')+'</p></div>'+
  (flashFlipped?'<div class="actions center">'+button('😀 I knew it!','flashKnow','primary huge')+button('🤔 Practice more','flashNeed','gold huge')+'</div>':'<div class="actions center">'+button('🔄 Flip','flip','gold huge')+'</div>')+
  '<div class="actions center" style="margin-top:12px">'+button('← Back','flashPrevious','light')+button('Skip →','flashNext','light')+'</div><div class="actions center" style="margin-top:12px">'+button('🏠 Home','home','sm plain')+'</div>',true);
  var el=$('#flashCard');el.addEventListener('click',flipFlash);el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();flipFlash()}})}
function flipFlash(){flashFlipped=!flashFlipped;renderFlash()}
function rateFlash(known){var f=flashList[flashIndex];if(!f)return;data.reviews[f.id]=known;save();advanceFlash(1)}
function advanceFlash(step){flashIndex=(flashIndex+step+flashList.length)%flashList.length;flashFlipped=false;renderFlash()}

/* ---------- picture practice ---------- */
function showVisual(mode){currentMode=mode;var f=practiceFact,visual='';
  if(mode==='area'){var cells='';for(var i=0;i<f.a*f.b;i++)cells+='<span class="cell"></span>';
    visual='<p class="tip">'+f.a+(f.a===1?' row. ':' rows. ')+f.b+(f.b===1?' square':' squares')+' in each row.</p><div class="gridarea" style="--cols:'+Math.max(1,f.b)+'">'+(cells||'<span class="zero">0 squares</span>')+'</div>'}
  else{var g='';for(var j=0;j<f.a;j++){var t='';for(var k=0;k<f.b;k++)t+='<span class="tick"></span>';g+='<div class="bundle" aria-label="Group of '+f.b+'">'+(t||'<span class="zero">empty</span>')+'</div>'}
    visual='<p class="tip">'+f.a+(f.a===1?' group. ':' groups. ')+f.b+(f.b===1?' stick':' sticks')+' in each group.</p><div class="ticks">'+(g||'<p class="zero dark">0 groups means 0 sticks.</p>')+'</div>'}
  var fb=practiceState==='good'?'<div class="feedback good">⚾ Home run! '+f.a+' × '+f.b+' = '+f.p+'</div>':practiceState==='bad'?'<div class="feedback bad">Not quite. Count again! You can do it.</div>':'';
  html('<h2 class="page-title">'+(mode==='area'?'🟩 Build Boxes':'🥢 Count Sticks')+'</h2><form id="visForm" autocomplete="off"><div class="questioncard"><div class="factline">'+f.a+' × '+f.b+' = ?</div>'+visual+
  (practiceState==='good'?fb+'<div class="actions center">'+button('Next problem →','newVisual','primary huge')+'</div>':
   numBox('response','Your answer')+'<div id="hint" class="hint hidden" role="alert"></div>'+fb+keypad('Check ✓'))+'</div></form>'+
  '<div class="actions center" style="margin-top:14px">'+(practiceState==='good'?'':button('New problem','newVisual','light'))+button(mode==='area'?'🥢 Try sticks':'🟩 Try boxes',mode==='area'?'sticks':'area','light')+button('🏠 Home','home','sm plain')+'</div>',true);
  var form=$('#visForm');form.addEventListener('submit',function(e){e.preventDefault();checkVisual()});wireInputs()}
function newVisual(){practiceFact=FACTS[Math.floor(Math.random()*FACTS.length)];practiceState='';showVisual(currentMode)}
function checkVisual(){var v=readNum($('#response'));if(v===null){showHint('Type your answer first 🙂');return}practiceState=v===practiceFact.p?'good':'bad';showVisual(currentMode)}
function buildRetest(){var missed=recentMistakes();if(!missed.length){nav('report');return}if(data.active&&!confirm('You already have a quiz going. Start a new one instead?'))return;
  var q=shuffle(missed.map(function(r){return FACTS.filter(function(f){return f.id===r.id})[0]}).filter(Boolean));
  data.active={type:'facts',style:'vertical',questions:q,answers:[],startedAt:new Date().toISOString()};save();currentMode='facts';renderQuestion()}

/* ---------- scores ---------- */
function showReport(){currentMode='report';var fs=data.sessions.filter(function(s){return s.type==='facts'}),as=data.sessions.filter(function(s){return s.type==='answer'}),lf=last(fs),la=last(as),misses=recentMistakes();
  var meters='';for(var a=0;a<=8;a++){var att=[];fs.forEach(function(s){s.answers.forEach(function(r){if(r.a===a)att.push(r)})});var c=att.filter(function(r){return r.correct}).length,p=att.length?Math.round(c/att.length*100):null;
    meters+='<div class="meter"><b>'+a+'s</b><div class="bar"><i class="'+(p===null?'':p>=90?'good':p>=60?'ok':'low')+'" style="width:'+(p===null?0:Math.max(p,4))+'%"></i></div><span>'+(p===null?'—':p>=90?'⭐ '+p+'%':p+'%')+'</span></div>'}
  var hist=data.sessions.slice().reverse().slice(0,20).map(function(s){return '<tr><td>'+new Date(s.finishedAt).toLocaleDateString()+'</td><td>'+(s.type==='facts'?'Times Quiz':'Missing Number')+(s.partial?' (stopped early)':'')+'</td><td>'+s.correct+'/'+s.total+'</td></tr>'}).join('')||'<tr><td colspan="3">No games yet.</td></tr>';
  function st(s){return s?s.correct+'/'+s.total+' ('+pctOf(s)+'%)':'Not played yet'}
  html('<h2 class="page-title">⭐ My Scores</h2><div class="stats"><div class="stat">'+(lf?stars(pctOf(lf)):'<b>—</b>')+'<small>Last Times Quiz</small></div><div class="stat">'+(la?stars(pctOf(la)):'<b>—</b>')+'<small>Last Missing Number</small></div><div class="stat"><b>'+misses.length+'</b><small>Facts to practice</small></div></div>'+
  (misses.length?'<div class="actions center" style="margin-top:16px">'+button('🃏 Practice them','reviewMissed','gold')+button('🔁 Try them again','retest','primary')+'</div>':'')+
  '<h3 class="subhead">How strong is each times table?</h3><div class="meters">'+meters+'</div>'+
  (misses.length?'<h3 class="subhead">Facts to practice</h3><div class="misses">'+misses.map(function(x){return '<div class="miss"><b>'+x.a+' × '+x.b+' = '+x.p+'</b></div>'}).join('')+'</div>':'<div class="note big" style="margin-top:16px">No facts to practice right now. 🎉 Play a quiz to earn more stars!</div>')+
  '<details class="grownups"><summary>For grown-ups</summary><div class="note">Times Quiz: <strong>'+st(lf)+'</strong><br>Missing Number: <strong>'+st(la)+'</strong><br>Games finished: <strong>'+data.sessions.length+'</strong></div>'+
  '<div class="tablewrap" style="margin-top:12px"><table class="reporttable"><thead><tr><th>Date</th><th>Game</th><th>Score</th></tr></thead><tbody>'+hist+'</tbody></table></div>'+
  '<p class="note" style="margin-top:12px">Quizzes give no hints and hide answers until the end. Mastery is best confirmed with repeated full quizzes on different days. "Two boxes" questions accept any correct factor pair. Scores are saved only in this browser on this device.</p>'+
  '<div class="actions" style="margin-top:12px">'+button('Download scores (CSV)','exportCsv','light sm')+button('Erase all scores','reset','red sm')+'</div></details>'+
  '<div class="actions center" style="margin-top:20px">'+button('🏠 Home','home','light')+'</div>')}
function exportCsv(){var rows=[['Date','Mode','Style','Fact','Product','Student Answer','Correct']];data.sessions.forEach(function(s){s.answers.forEach(function(r){rows.push([s.finishedAt,s.type,s.style,r.a+' x '+r.b,r.p,Array.isArray(r.given)?r.given.join(' x '):r.given,r.correct])})});
  var csv=rows.map(function(row){return row.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='chris-ii-multiplication-results.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function resetAll(){if(confirm('Erase ALL of Chris’s scores and quizzes on this device? This cannot be undone.')){data=initialData();save();nav('home')}}

var handlers={home:function(){nav('home')},facts:function(){nav('facts')},answer:function(){nav('answer')},area:function(){nav('area')},sticks:function(){nav('sticks')},flash:function(){nav('flash')},report:function(){nav('report')},
  beginTest:beginTest,resume:resume,earlyFinish:earlyFinish,flip:flipFlash,flashKnow:function(){rateFlash(true)},flashNeed:function(){rateFlash(false)},flashNext:function(){advanceFlash(1)},flashPrevious:function(){advanceFlash(-1)},
  flashAll:function(){startFlash('all')},reviewMissed:function(){startFlash('missed')},retest:buildRetest,newVisual:newVisual,exportCsv:exportCsv,reset:resetAll};
document.addEventListener('mousedown',function(e){if(e.target.closest&&e.target.closest('.key'))e.preventDefault()});
document.addEventListener('click',function(e){var t=e.target;if(!t.closest)return;var key=t.closest('[data-key]');if(key){pressKey(key.getAttribute('data-key'));return}
  var ch=t.closest('[data-chip]');if(ch){pickChip(ch);return}var b=t.closest('[data-action]');if(b&&handlers[b.getAttribute('data-action')])handlers[b.getAttribute('data-action')]()});
$('#homeButton').addEventListener('click',function(){nav('home')});showHome();
</script></body></html>
