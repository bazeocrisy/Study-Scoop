<div class="top"><div class="top-inner">
  <span class="lesson">Lesson 7-2</span>
  <div class="bar"><i id="bar"></i></div>
  <span class="stepnum" id="stepnum"></span>
</div></div>
<main id="main"></main>

<script>
"use strict";
/* ---------------- storage ---------------- */
const KEY = "lesson7-2-fractions-v1";
let S = {page:0, items:{}, reflect:"", mindset:"", notice:""};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function item(id){ return S.items[id] || (S.items[id] = {tries:0, hint:false, shown:false, done:false}); }

/* ---------------- helpers ---------------- */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const k in attrs){
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const NS = "http://www.w3.org/2000/svg";
function s(tag, attrs={}, ...kids){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs){
    if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const pts = a => a.map(p => p.join(",")).join(" ");
const canSpeak = "speechSynthesis" in window;
function say(t){
  if (!canSpeak) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate = .9; speechSynthesis.speak(u); } catch(e){}
}
function sayBtn(text){ return canSpeak ? h("button",{class:"say","aria-label":"Read to me",onclick:()=>say(text)},"🔊 Read") : null; }
function confetti(){
  const box = h("div",{class:"confetti"}); const cols=["#1f9d55","#1e6fd9","#e08a1e","#5b3fa6","#e4507a","#f2c230"];
  for (let i=0;i<40;i++){ const c=h("i"); c.style.left=Math.random()*100+"vw"; c.style.background=cols[i%cols.length];
    c.style.animationDelay=(Math.random()*.5)+"s"; box.append(c); }
  document.body.append(box); setTimeout(()=>box.remove(), 2400);
}
function fb(el, kind, text){ el.className = "fb show " + kind; el.textContent = text; }
const WORD = {2:"halves",3:"thirds",4:"fourths",6:"sixths",8:"eighths"};
const PALE = ["#ffd0d0","#ffe3b0","#fff3a6","#cdf1c6","#bfe3ff","#d9cffd","#ffd1ec","#bff0ea","#f6dcc0","#d6e6c3","#e2d6f7","#c9e7f5"];

/* ---------------- multiple choice ---------------- */
function mc(id, options, onRight){
  const it = item(id); const box = h("div"); const msg = h("div",{class:"fb"});
  options.forEach((o,i) => {
    const b = h("button",{class:"btn opt"+(it.done && o.ok ? " right":""),onclick:()=>{
      if (it.done) return;
      if (o.ok){ it.done = true; save(); b.classList.add("right"); fb(msg,"ok","⭐ "+(o.fb||"Yes!")); confetti(); onRight && onRight(); }
      else { it.tries++; save(); b.classList.add("wrong"); fb(msg,"no",o.fb||"Not quite. Try again!"); }
    }}, o.t);
    box.append(b);
  });
  if (it.done){ const r = options.find(o=>o.ok); fb(msg,"ok","⭐ "+(r.fb||"Yes!")); }
  box.append(msg); return box;
}

const STUDY_LINK = () => h("p",{class:"noprint"}, h("a",{class:"btn small",href:"../index.html#math?ch=7"},"‹ Back to Study Scoop, Chapter 7"));
const PRINT_BTN = () => h("button",{class:"btn primary",onclick:()=>window.print()},"🖨 Print this page");
const RESET_BTN = () => h("button",{class:"btn noprint",onclick:e=>{ const b=e.currentTarget; if (b.dataset.sure){ S={page:0,items:{},reflect:"",mindset:"",notice:""}; save(); go(0);} else { b.dataset.sure="1"; b.textContent="Tap again to erase everything"; } }},"Start over");
/* ---------------- Teach Me: step-by-step lessons ---------------- */
function pageIndex(name){ return pages.findIndex(p => p.pname === name); }
function remember(text, teach){
  return h("div",{class:"remember"}, h("b",{},"📘 Remember: "), text, " ",
    teach ? h("button",{class:"btn small",onclick:()=>{ S.returnTo = S.page; save(); go(pageIndex(teach)); }},"▶ Watch the lesson again") : null);
}
function backToProblem(){
  if (S.returnTo == null || S.returnTo <= S.page) return null;
  return h("div",{class:"row",style:"margin-bottom:10px"}, h("button",{class:"btn go",onclick:()=>{ const r=S.returnTo; S.returnTo=null; save(); go(r); }},"↩ Back to the problem"));
}
let clipN = 0;
const D = {
  line:(L,a,b,n,col="#1b3a8a",w=5)=>L.line.append(s("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:col,"stroke-width":w,"stroke-linecap":"round",class:n?"draw":""})),
  circle:(L,c,r)=>L.line.append(s("circle",{cx:c[0],cy:c[1],r,fill:"none",stroke:"#2b2b2b","stroke-width":4})),
  poly:(L,P,fill,n)=>L.fill.append(s("polygon",{points:pts(P),fill,class:n?"fade":""})),
  outline:(L,P)=>L.line.append(s("polygon",{points:pts(P),fill:"none",stroke:"#2b2b2b","stroke-width":4,"stroke-linejoin":"round"})),
  path:(L,d,fill,n)=>L.fill.append(s("path",{d,fill,class:n?"fade":""})),
  dot:(L,p,n)=>L.top.append(s("circle",{cx:p[0],cy:p[1],r:9,fill:"#1e6fd9",class:n?"pulse":""})),
  text:(L,x,y,t,n,size=26,fill="#1f2a44")=>L.top.append(s("text",{x,y:y+size*.35,"text-anchor":"middle","font-size":size,"font-weight":800,fill,stroke:"#fff","stroke-width":5,"paint-order":"stroke",class:n?"fade":""},t))
};
function sector(c,r,a0,a1){ const p=a=>[c[0]+r*Math.cos(a*Math.PI/180), c[1]+r*Math.sin(a*Math.PI/180)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1); return `M${c[0]},${c[1]} L${x0},${y0} A${r},${r} 0 ${a1-a0>180?1:0} 1 ${x1},${y1} Z`; }
function pizza(L, n, a0, newOnes){ // n equal slices of the demo circle, starting at angle a0
  const C=[150,150], R=110;
  for (let k=0;k<n;k++) D.path(L, sector(C,R,a0+360*k/n,a0+360*(k+1)/n), PALE[k], newOnes);
  for (let k=0;k<n/2;k++){ const a=(a0+360*k/n)*Math.PI/180; D.line(L,[150+R*Math.cos(a),150+R*Math.sin(a)],[150-R*Math.cos(a),150-R*Math.sin(a)],false); }
}
function stepper(id, steps){
  const it = item(id); let i = 0;
  const svg = s("svg",{viewBox:"0 0 300 300",style:"width:100%;height:auto;display:block"});
  const txt = h("div",{class:"steptext"}), cnt = h("span",{class:"stepcount"});
  const prev = h("button",{class:"btn",onclick:()=>{ if(i>0){ i--; render(false); } }},"◀ Step back");
  const next = h("button",{class:"btn primary",onclick:()=>{ if(i<steps.length-1){ i++; render(true); } }},"Next step ▶");
  const again = h("button",{class:"btn",onclick:()=>{ i=0; render(true); }},"↻ Watch again");
  const read = canSpeak ? h("button",{class:"say",onclick:()=>say(steps[i].text)},"🔊 Read") : null;
  function render(speak){
    let start = 0; for (let k=0;k<=i;k++) if (steps[k].reset) start = k;
    const L = {defs:s("defs"), fill:s("g"), line:s("g"), top:s("g"), svg};
    svg.replaceChildren(L.defs, L.fill, L.line, L.top);
    for (let k=start;k<=i;k++) steps[k].draw && steps[k].draw(L, k===i);
    txt.replaceChildren(h("b",{class:"steplabel"}, steps[i].label), " ", steps[i].text);
    cnt.textContent = `Step ${i+1} of ${steps.length}`;
    prev.disabled = i===0; next.hidden = i===steps.length-1; again.hidden = i!==steps.length-1;
    if (i===steps.length-1 && !it.done){ it.done = true; save(); }
    if (speak) say(steps[i].text);
  }
  render(false);
  return h("div",{class:"demo"}, h("div",{class:"figure"},svg), txt, h("div",{class:"row",style:"justify-content:center"},prev,next,again,read), h("p",{class:"howto"},cnt));
}
const teachChip = () => h("span",{class:"chip c-teach"},"Teach Me");

/* type-your-own explanation */
function explainBox(id, o, onDone){
  const it = item(id); it.text = it.text || "";
  const ta = h("textarea",{id:"ta-"+id,placeholder:"Type your explanation here…",oninput:e=>{ it.text = e.target.value; save(); }}); ta.value = it.text;
  const msg = h("div",{class:"fb"});
  const starters = o.starters.map(s0=>h("button",{class:"btn small starter",onclick:()=>{
    ta.value += (ta.value && !/\s$/.test(ta.value) ? " " : "") + s0.replace("…"," "); it.text = ta.value; save(); ta.focus(); }},s0));
  const words = () => it.text.trim().split(/\s+/).filter(Boolean).length;
  const done = h("button",{class:"btn go",onclick:()=>{
    if (it.done) return;
    if (words() < 5){ fb(msg,"no","Write a little more. Use a full sentence that tells WHY."); return; }
    if (!o.keywords.test(it.text) && !it.nudged){ it.nudged = true; save(); fb(msg,"hint","💡 "+o.nudge+" You can add to your answer, or press the button again to keep it."); return; }
    it.done = true; it.matched = o.keywords.test(it.text); save();
    fb(msg,"ok", it.matched ? "⭐ "+o.praise : "Thanks for explaining! Now check your thinking below.");
    ta.readOnly = true; done.hidden = true; onDone && onDone();
  }},"✔ I'm done explaining");
  if (it.done){ ta.readOnly = true; done.hidden = true; fb(msg,"ok", it.matched ? "⭐ "+o.praise : "Thanks for explaining! Now check your thinking below."); }

const pages = [];
const page = (fn, name) => { fn.pname = name; pages.push(fn); };
const RCT = (x,y,w,hh)=>[[x,y],[x+w,y],[x+w,y+hh],[x,y+hh]];
function centroid(P){ return [P.reduce((a,p)=>a+p[0],0)/P.length, P.reduce((a,p)=>a+p[1],0)/P.length]; }
const reg = (n, R, a0, cx=150, cy=150) => Array.from({length:n},(_,k)=>{const a=(a0+360*k/n)*Math.PI/180; return [+(cx+R*Math.cos(a)).toFixed(2), +(cy+R*Math.sin(a)).toFixed(2)];});
const GREEN = "#4caf50";

/* ---- fraction figures: each part is {pts} (polygon) or {d} (path) with a label spot {c} ---- */
const FIG = {
  grid:(cols,rows,x=40,y=60,w=220,hh=180)=>{ const out=[]; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ const P=RCT(x+w*c/cols,y+hh*r/rows,w/cols,hh/rows); out.push({pts:P,c:centroid(P)}); } return out; },
  strips:(n,x=20,y=95,w=260,hh=110)=>FIG.grid(n,1,x,y,w,hh),
  pie:(n,a0=-90,R=120)=>Array.from({length:n},(_,k)=>{ const a=a0+360*k/n, b=a0+360*(k+1)/n, m=(a+b)/2*Math.PI/180;
      return {d:sector([150,150],R,a,b), c:[150+R*.6*Math.cos(m),150+R*.6*Math.sin(m)]}; }),
  radial:(n,a0,R=125)=>{ const P=reg(n,R,a0); return P.map((p,k)=>{ const T=[[150,150],p,P[(k+1)%n]]; return {pts:T,c:centroid(T)}; }); },
  tri3:()=>{ const A=[150,35],B=[30,250],C=[270,250],G=centroid([A,B,C]); return [[A,B],[B,C],[C,A]].map(([p,q])=>{ const T=[G,p,q]; return {pts:T,c:centroid(T)}; }); },
  sq8:()=>{ const P=[[45,45],[255,45],[255,255],[45,255]], O=[150,150], out=[];
    for(let i=0;i<4;i++){ const a=P[i], b=P[(i+1)%4], m=[(a[0]+b[0])/2,(a[1]+b[1])/2]; out.push({pts:[O,a,m],c:centroid([O,a,m])},{pts:[O,m,b],c:centroid([O,m,b])}); } return out; }
};
function fracSvg(parts, {shaded=[], fill=GREEN, tap, count=false, extra}={}){
  const svg = s("svg",{viewBox:"0 0 300 300",style:"width:100%;height:auto;display:block"});
  const labels = s("g",{"pointer-events":"none"}); let n = 0;
  const els = parts.map((p,i) => {
    const attrs = {fill: shaded.includes(i)?fill:"#fff", stroke:"#2b2b2b","stroke-width":3,"stroke-linejoin":"round"};
    const e = p.d ? s("path",{d:p.d,...attrs}) : s("polygon",{points:pts(p.pts),...attrs});
    if (tap || count){ e.style.cursor="pointer"; e.addEventListener("click",()=>{
      if (tap) tap(i,e);
      else if (!e.dataset.n){ e.dataset.n = ++n; labels.append(s("text",{x:p.c[0],y:p.c[1]+8,"text-anchor":"middle","font-size":22,"font-weight":800,fill:"#1f2a44",stroke:"#fff","stroke-width":4,"paint-order":"stroke"},String(n))); }
    }); }
    svg.append(e); return e;
  });
  if (extra) extra(svg);
  svg.append(labels);
  svg.resetCount = () => { n = 0; labels.replaceChildren(); els.forEach(e=>delete e.dataset.n); };
  svg.els = els; return svg;
}
function countFigure(parts, opts={}){
  const svg = fracSvg(parts,{...opts,count:true});
  return h("div",{}, h("div",{class:"figure"},svg),
    h("p",{class:"howto"},"Tap each part to count it."),
    h("div",{class:"row",style:"justify-content:center"}, h("button",{class:"btn small",onclick:()=>svg.resetCount()},"Count again")));
}
const fracHTML = (n,d) => h("span",{class:"frac"}, h("span",{},String(n)), h("span",{},String(d)));

/* ---- type a fraction ---- */
function fracInput(id, ans, kind){
  const it = item(id);
  const mk = (lab) => h("input",{type:"text",inputmode:"numeric",maxlength:2,autocomplete:"off","aria-label":lab,class:"fbox"});
  const top = mk("top number (numerator)"), bot = mk("bottom number (denominator)");
  const msg = h("div",{class:"fb"});
  const chk = h("button",{class:"btn go small",onclick:check},"✔ Check");
  const win = () => `⭐ Yes! ${ans[0]}/${ans[1]}.`;
  function check(){
    if (it.done) return;
    const n = parseInt(top.value,10), d = parseInt(bot.value,10);
    if (isNaN(n) || isNaN(d)){ fb(msg,"no","Fill in both boxes: a top number and a bottom number."); return; }
    if (n===ans[0] && d===ans[1]){ it.done=true; save(); fb(msg,"ok",win()); top.readOnly=bot.readOnly=true; chk.hidden=true; confetti(); say(`Yes! ${ans[0]} over ${ans[1]}.`); return; }
    it.tries++; save();
    let t;
    if (n===ans[1] && d===ans[0]) t = "Flip it! The BOTTOM number counts all the equal parts. The TOP number counts the parts you are talking about.";
    else if (d!==ans[1] && kind!=="unit" && d===ans[1]-ans[0]) t = "It looks like you counted only some of the parts for the bottom number. The bottom number counts ALL the equal parts, shaded and white.";
    else if (d!==ans[1]) t = "Check the bottom number. Count ALL the equal parts in the whole.";
    else if (kind==="unit") t = "A unit fraction always has 1 on top. It names ONE equal part.";
    else if (kind==="unshaded") t = "Check the top number. Count only the WHITE (unshaded) parts.";
    else t = "Check the top number. Count only the SHADED parts.";
    fb(msg,"no",t);
  }
  if (it.done){ top.value=ans[0]; bot.value=ans[1]; top.readOnly=bot.readOnly=true; chk.hidden=true; fb(msg,"ok",win()); }
  [top,bot].forEach(e=>e.addEventListener("keydown",ev=>{ if(ev.key==="Enter") check(); }));
  return h("div",{class:"fracq"}, h("div",{class:"row"}, h("span",{class:"fracin"}, top, h("span",{class:"fbar"}), bot), chk), msg);
}

/* ---- shade parts to show a fraction ---- */
function shadeIt(id, parts, ans){
  const it = item(id); it.on = it.on || [];
  const msg = h("div",{class:"fb"}); const live = h("p",{class:"live"});
  const svg = fracSvg(parts,{shaded:it.on, tap:(i,e)=>{
    if (it.done) return;
    const k = it.on.indexOf(i); if (k>=0) it.on.splice(k,1); else it.on.push(i);
    e.setAttribute("fill", it.on.includes(i)?GREEN:"#fff"); save(); upd(); msg.className="fb"; }});
  function upd(){ live.replaceChildren(`You shaded ${it.on.length} of ${parts.length} parts: `, fracHTML(it.on.length, parts.length)); }
  const chk = h("button",{class:"btn go small",onclick:()=>{
    if (it.done) return;
    const x = it.on.length;
    if (x===ans[0]){ it.done=true; save(); fb(msg,"ok",`⭐ Yes! ${x} of ${ans[1]} equal parts are shaded. That shows ${ans[0]}/${ans[1]}.`); chk.hidden=true; confetti(); return; }
    it.tries++; save();
    fb(msg,"no", x<ans[0] ? `The top number is ${ans[0]}, so shade ${ans[0]} parts. You shaded ${x}. Shade more.` : `The top number is ${ans[0]}, so shade only ${ans[0]} parts. You shaded ${x}. Tap a part to un-shade it.`);
  }},"✔ Check");
  upd(); if (it.done){ chk.hidden=true; fb(msg,"ok",`⭐ Yes! That shows ${ans[0]}/${ans[1]}.`); }
  return h("div",{}, h("div",{class:"figure"},svg), h("p",{class:"howto"},"Tap a part to shade it. Tap again to un-shade."), live, h("div",{class:"row",style:"justify-content:center"},chk), msg);
}

/* ---------------- navigation ---------------- */
function go(i){
  if (canSpeak) try{ speechSynthesis.cancel(); }catch(e){}
  S.page = Math.max(0, Math.min(pages.length-1, i)); save();
  $("#main").replaceChildren(...pages[S.page]());
  $("#bar").style.width = (100*S.page/(pages.length-1))+"%";
  $("#stepnum").textContent = `Page ${S.page+1} of ${pages.length}`;
  $("#back").disabled = S.page===0;
  $("#next").textContent = S.page===pages.length-2 ? "Finish ▶" : "Next ▶";
  $("#next").style.visibility = S.page===pages.length-1 ? "hidden" : "visible";
  window.scrollTo(0,0);
}
$("#back").onclick = () => go(S.page-1);
$("#next").onclick = () => go(S.page+1);
go(S.page || 0);
