<style>

<div class="top"><div class="top-inner">
  <span class="lesson">Lesson 7-1</span>
  <div class="bar"><i id="bar"></i></div>
  <span class="stepnum" id="stepnum"></span>
</div></div>
<main id="main"></main>
<div class="nav"><div class="nav-inner">
  <button class="btn" id="back">◀ Back</button>
  <button class="btn primary" id="next">Next ▶</button>

<script>
"use strict";
const STUDY_LINK = () => h("p",{class:"noprint"}, h("a",{class:"btn small",href:"../index.html#math?ch=7"},"‹ Back to Study Scoop, Chapter 7"));
/* ---------------- storage ---------------- */
const KEY = "studyscoop-lesson7-1-v1";
let S = {name:"", page:0, items:{}, reflect:"", mindset:""};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function item(id){ return S.items[id] || (S.items[id] = {tries:0, hint:false, shown:false, done:false}); }

/* ---------------- helpers ---------------- */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const k in attrs){
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const NS = "http://www.w3.org/2000/svg";
function s(tag, attrs={}, ...kids){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs){
    if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const pts = a => a.map(p => p.join(",")).join(" ");
const canSpeak = "speechSynthesis" in window;
function say(t){
  if (!canSpeak) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate = .9; speechSynthesis.speak(u); } catch(e){}
}
function sayBtn(text){ return canSpeak ? h("button",{class:"say","aria-label":"Read to me",onclick:()=>say(text)},"🔊 Read") : null; }
function confetti(){
  const box = h("div",{class:"confetti"}); const cols=["#1f9d55","#1e6fd9","#e08a1e","#5b3fa6","#e4507a","#f2c230"];
  for (let i=0;i<40;i++){ const c=h("i"); c.style.left=Math.random()*100+"vw"; c.style.background=cols[i%cols.length];
    c.style.animationDelay=(Math.random()*.5)+"s"; box.append(c); }
  document.body.append(box); setTimeout(()=>box.remove(), 2400);
}
function fb(el, kind, text){ el.className = "fb show " + kind; el.textContent = text; }
const WORD = {2:"halves",3:"thirds",4:"fourths",6:"sixths",8:"eighths"};
const PALE = ["#ffd0d0","#ffe3b0","#fff3a6","#cdf1c6","#bfe3ff","#d9cffd","#ffd1ec","#bff0ea","#f6dcc0","#d6e6c3","#e2d6f7","#c9e7f5"];

/* ---------------- geometry / equal-parts checker ---------------- */
const N = 300, SZ = 300, CELL = SZ / N;
function insideFn(shape){
  if (shape.type === "circle"){ const {cx,cy,r} = shape; return (x,y) => (x-cx)**2 + (y-cy)**2 <= r*r; }
  const P = shape.pts;
  return (x,y) => { let c=false; for (let i=0,j=P.length-1;i<P.length;j=i++){
    const [xi,yi]=P[i],[xj,yj]=P[j];
    if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; };
}
function insideMask(shape){
  const f = insideFn(shape), m = new Uint8Array(N*N);
  for (let j=0;j<N;j++) for (let i=0;i<N;i++) m[j*N+i] = f((i+.5)*CELL,(j+.5)*CELL) ? 1 : 0;
  return m;
}
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy; let t = L ? ((px-ax)*dx+(py-ay)*dy)/L : 0;
  t = Math.max(0,Math.min(1,t)); const qx=ax+t*dx-px, qy=ay+t*dy-py; return Math.sqrt(qx*qx+qy*qy);
}
function analyze(inside, segs){
  const bar = new Uint8Array(N*N), R = 1.3;
  for (const [[ax,ay],[bx,by]] of segs){
    const i0=Math.max(0,Math.floor((Math.min(ax,bx)-R)/CELL)), i1=Math.min(N-1,Math.ceil((Math.max(ax,bx)+R)/CELL));
    const j0=Math.max(0,Math.floor((Math.min(ay,by)-R)/CELL)), j1=Math.min(N-1,Math.ceil((Math.max(ay,by)+R)/CELL));
    for (let j=j0;j<=j1;j++) for (let i=i0;i<=i1;i++)
      if (inside[j*N+i] && segDist((i+.5)*CELL,(j+.5)*CELL,ax,ay,bx,by) < R) bar[j*N+i]=1;
  }
  const lab = new Int32Array(N*N).fill(-1); let total = 0; for (let k=0;k<N*N;k++) total += inside[k];
  const sizes = []; const stack = [];
  for (let k=0;k<N*N;k++){
    if (!inside[k] || bar[k] || lab[k] >= 0) continue;
    const id = sizes.length; let n = 0; lab[k]=id; stack.push(k);
    while (stack.length){ const c = stack.pop(); n++; const x=c%N, y=(c/N)|0;
      for (const d of [x>0?c-1:-1, x<N-1?c+1:-1, y>0?c-N:-1, y<N-1?c+N:-1])
        if (d>=0 && inside[d] && !bar[d] && lab[d]<0){ lab[d]=id; stack.push(d); } }
    sizes.push(n);
  }
  // drop slivers, then give line pixels and slivers to the nearest real part
  const keep = sizes.map(n => n >= total*0.006);
  for (let k=0;k<N*N;k++) if (lab[k]>=0 && !keep[lab[k]]) lab[k]=-1;
  let q = []; for (let k=0;k<N*N;k++) if (lab[k]>=0) q.push(k);
  while (q.length){ const nq=[]; for (const c of q){ const x=c%N, y=(c/N)|0;
      for (const d of [x>0?c-1:-1, x<N-1?c+1:-1, y>0?c-N:-1, y<N-1?c+N:-1])
        if (d>=0 && inside[d] && lab[d]<0){ lab[d]=lab[c]; nq.push(d); } } q = nq; }
  const map = {}; let count = 0; sizes.forEach((n,i)=>{ if(keep[i]) map[i]=count++; });
  const area = new Array(count).fill(0), sx = new Array(count).fill(0), sy = new Array(count).fill(0);
  for (let k=0;k<N*N;k++) if (lab[k]>=0){ const r=map[lab[k]]; lab[k]=r; area[r]++; sx[r]+=k%N; sy[r]+=(k/N)|0; }
  const cents = area.map((a,r)=>[(sx[r]/a+.5)*CELL,(sy[r]/a+.5)*CELL]);
  // a nicer label spot: the region cell closest to the centroid
  const spots = cents.map(()=>null), best = cents.map(()=>Infinity);
  for (let k=0;k<N*N;k++){ const r=lab[k]; if (r<0) continue; const x=(k%N+.5)*CELL, y=(((k/N)|0)+.5)*CELL;
    const d=(x-cents[r][0])**2+(y-cents[r][1])**2; if (d<best[r]){best[r]=d; spots[r]=[x,y];} }
  const ratio = count ? Math.max(...area)/Math.min(...area) : 1;
  return {count, area, lab, spots, bar, equal: count>0 && ratio <= 1.06, ratio};
}
function sameWay(a, b){ // compare two line masks (IoU)
  let inter=0, uni=0; for (let k=0;k<N*N;k++){ if (a[k]||b[k]) uni++; if (a[k]&&b[k]) inter++; }
  return uni && inter/uni > 0.7;
}

/* shapes */
const reg = (n, R, a0, cx=150, cy=150) => Array.from({length:n},(_,k)=>{const a=(a0+360*k/n)*Math.PI/180; return [+(cx+R*Math.cos(a)).toFixed(2), +(cy+R*Math.sin(a)).toFixed(2)];});
function edgePoints(P, divs){ const out=[]; for (let i=0;i<P.length;i++){ const A=P[i], B=P[(i+1)%P.length];
  for (const t of divs) out.push([A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t]); } return out; }
function polySnaps(P, divs=[.5], center=[150,150]){ return [...P, ...edgePoints(P,divs), center]; }
const PLUS = [[110,30],[190,30],[190,110],[270,110],[270,190],[190,190],[190,270],[110,270],[110,190],[30,190],[30,110],[110,110]];

/* ---------------- drawing board ---------------- */
function board(o){
  // o: id, shape, target, snaps, hint, solution, otherBoard(fn), title
  const it = item(o.id); it.segs = it.segs || [];
  const inside = insideMask(o.shape);
  const cv = h("canvas",{width:N,height:N}); const ctx = cv.getContext("2d");
  const svg = s("svg",{viewBox:"0 0 300 300","aria-label":"drawing area"});
  const outline = o.shape.type==="circle"
    ? s("circle",{cx:o.shape.cx,cy:o.shape.cy,r:o.shape.r,fill:"none",stroke:"#2b2b2b","stroke-width":3})
    : s("polygon",{points:pts(o.shape.pts),fill:"none",stroke:"#2b2b2b","stroke-width":3,"stroke-linejoin":"round"});
  const gShow = s("g"), gLines = s("g"), gLabels = s("g"), gSnaps = s("g");
  const preview = s("line",{stroke:"#1e6fd9","stroke-width":4,"stroke-linecap":"round","stroke-dasharray":"6 6",visibility:"hidden"});
  svg.append(outline, gShow, gLines, preview, gLabels, gSnaps);
  const snapEls = o.snaps.map(p => { const c = s("circle",{cx:p[0],cy:p[1],r:6,fill:"#8aa0c2"}); gSnaps.append(c); return c; });
  const stage = h("div",{class:"stage"}, cv, svg);
  const msg = h("div",{class:"fb"});
  const hintBox = h("div",{class:"fb"});
  let result = null;

  function drawLines(){
    gLines.replaceChildren(...it.segs.map(([a,b]) => s("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:"#1b3a8a","stroke-width":4,"stroke-linecap":"round"})));
  }
  function clearColors(){ ctx.clearRect(0,0,N,N); gLabels.replaceChildren(); result=null; msg.className="fb"; }
  function paint(r, good){
    const img = ctx.createImageData(N,N);
    const cols = r.area.map((_,i)=>PALE[i%PALE.length]);
    const rgb = cols.map(c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]);
    for (let k=0;k<N*N;k++){ const L=r.lab[k]; if (L<0) continue; const [R,G,B]=rgb[L]; img.data.set([R,G,B,255],k*4); }
    ctx.putImageData(img,0,0);
    const big = Math.max(...r.area), small = Math.min(...r.area);
    gLabels.replaceChildren(...r.spots.map((p,i)=>{
      let t = String(i+1);
      if (!good && r.count===o.target && !r.equal){ if (r.area[i]===big) t="big"; else if (r.area[i]===small) t="small"; }
      const fs = t.length>2 ? 15 : 20;
      return s("text",{x:p[0],y:p[1]+fs*.35,"text-anchor":"middle","font-size":fs,"font-weight":800,fill:"#1f2a44",
        stroke:"#fff","stroke-width":4,"paint-order":"stroke"},t);

/* type-your-own explanation */
function explainBox(id, o, onDone){
  const it = item(id); it.text = it.text || "";
  const ta = h("textarea",{id:"ta-"+id,placeholder:"Type your explanation here…",oninput:e=>{ it.text = e.target.value; save(); }}); ta.value = it.text;
  const msg = h("div",{class:"fb"});
  const starters = o.starters.map(s0=>h("button",{class:"btn small starter",onclick:()=>{
    ta.value += (ta.value && !/\s$/.test(ta.value) ? " " : "") + s0.replace("…"," "); it.text = ta.value; save(); ta.focus(); }},s0));
  const words = () => it.text.trim().split(/\s+/).filter(Boolean).length;
  const done = h("button",{class:"btn go",onclick:()=>{
    if (it.done) return;
    if (words() < 5){ fb(msg,"no","Write a little more. Use a full sentence that tells WHY."); return; }
    if (!o.keywords.test(it.text) && !it.nudged){ it.nudged = true; save(); fb(msg,"hint","💡 "+o.nudge+" You can add to your answer, or press the button again to keep it."); return; }
    it.done = true; it.matched = o.keywords.test(it.text); save();
    fb(msg,"ok", it.matched ? "⭐ "+o.praise : "Thanks for explaining! Now check your thinking below.");
    ta.readOnly = true; done.hidden = true; onDone && onDone();
  }},"✔ I'm done explaining");
  if (it.done){ ta.readOnly = true; done.hidden = true; fb(msg,"ok", it.matched ? "⭐ "+o.praise : "Thanks for explaining! Now check your thinking below."); }
  return h("div",{},
    h("h2",{style:"margin-top:14px"}, o.prompt, sayBtn(o.prompt+" Type your explanation in your own words. If you need help starting, tap a sentence starter.")),
    h("p",{class:"howto",style:"text-align:left"},"Use your own words. Need help starting? Tap a sentence starter:"),
    h("div",{class:"row",style:"margin-bottom:8px"}, starters), ta,
    h("div",{class:"row",style:"margin-top:10px"}, done), msg);
}
